<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 맞춤 학습 대시보드 위젯</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="style.css?v=9.0">
</head>
<body>
  <div class="dashboard-card" id="dashboardWidget">

    <!-- ROW 1: Convenience Store Mobile Voucher Header & Progress -->
    <div class="voucher-section">
      <!-- Line 1: Student Name Tag & Dual Streaks (출석 + 숙제) -->
      <div class="header-line-student">
        <span class="student-name-tag" id="studentNameTag">🧑‍🎓 학생 로딩 중...</span>
        <div class="streaks-group">
          <span class="badge-pill pill-streak" id="pillStreak">🔥 0회 연속 출석</span>
          <span class="badge-pill pill-hw-streak" id="pillHwStreak">📝 0회 연속 완수</span>
        </div>
      </div>

      <!-- Line 2: Convenience Store Voucher Title & Points (Current / Target) -->
      <div class="header-line-voucher">
        <div class="voucher-title-wrap">
          <span class="voucher-icon">🏪</span>
          <span class="voucher-name">편의점 모바일 상품권</span>
        </div>
        <div class="voucher-amounts">
          <span class="cur-reward" id="rewardCurrentText">₩0</span>
          <span class="slash">/</span>
          <span class="target-reward" id="rewardTargetText">₩5,000</span>
        </div>
      </div>

      <!-- Glowing Gradient Progress Bar -->
      <div class="voucher-bar-row">
        <div class="voucher-bar-track">
          <div class="voucher-bar-fill" id="voucherBarFill" style="width: 0%;"></div>
        </div>
        <span class="voucher-percent-label" id="voucherPercentText">0%</span>
      </div>
    </div>

    <!-- ROW 2: Middle Section (2 Columns Side-by-Side: Checklist + Inspection Banner) -->
    <div class="middle-section">
      <!-- Left Column: Checklist -->
      <div class="checklist-col">
        <div class="checklist-header">
          <span class="checklist-icon">📝</span>
          <h2 class="checklist-title">오늘의 집숙제 체크리스트</h2>
        </div>
        <div class="task-list" id="taskList">
          <div class="task-loading-placeholder">오늘의 숙제를 불러오는 중입니다... ⏳</div>
        </div>
      </div>

      <!-- Right Column: Celebration & Inspection Banner (처음 로딩 시에는 빈 공간으로 시작하여 깜빡임 방지) -->
      <div class="inspection-col">
        <div class="inspection-banner" id="inspectionBanner" style="opacity: 0; pointer-events: none;">
          <div class="banner-emoji" id="bannerEmoji"></div>
          <div class="banner-title" id="bannerTitle"></div>
          <div class="banner-sub" id="bannerSub"></div>
        </div>
      </div>
    </div>

    <!-- ROW 3: Three Circular Ring Gauges (오늘 숙제, 출석률, 진도) -->
    <div class="gauges-section">
      <!-- Gauge 1: 오늘 숙제 -->
      <div class="gauge-item">
        <div class="ring-wrap">
          <svg class="ring-svg" width="68" height="68" viewBox="0 0 68 68">
            <defs>
              <linearGradient id="gradHw" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ec4899" />
                <stop offset="100%" stop-color="#8b5cf6" />
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="34" cy="34" r="28" stroke-width="6" />
            <circle class="ring-fill ring-hw" id="ringHwFill" cx="34" cy="34" r="28" stroke-width="6" stroke="url(#gradHw)" stroke-dasharray="175.93" stroke-dashoffset="0" />
          </svg>
        </div>
        <div class="gauge-info">
          <div class="gauge-title">오늘 숙제</div>
          <div class="gauge-primary-val" id="hwTodayRateText">오늘 0% 완료 /</div>
          <div class="gauge-sub-val" id="hwCumulativeText">누적 성실도 0% (0/0회)</div>
        </div>
      </div>

      <!-- Gauge 2: 출석률 -->
      <div class="gauge-item">
        <div class="ring-wrap">
          <svg class="ring-svg" width="68" height="68" viewBox="0 0 68 68">
            <defs>
              <linearGradient id="gradAtt" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10b981" />
                <stop offset="100%" stop-color="#34d399" />
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="34" cy="34" r="28" stroke-width="6" />
            <circle class="ring-fill ring-att" id="ringAttFill" cx="34" cy="34" r="28" stroke-width="6" stroke="url(#gradAtt)" stroke-dasharray="175.93" stroke-dashoffset="0" />
          </svg>
        </div>
        <div class="gauge-info">
          <div class="gauge-title">출석률</div>
          <div class="gauge-primary-val" id="attRateText">100% (<span class="flame-badge">🔥0회 연속</span>)</div>
          <div class="gauge-sub-val" id="attDetailText">출석 0회 / 총 0회</div>
        </div>
      </div>

      <!-- Gauge 3: 진도 -->
      <div class="gauge-item">
        <div class="ring-wrap">
          <svg class="ring-svg" width="68" height="68" viewBox="0 0 68 68">
            <defs>
              <linearGradient id="gradProg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0284c7" />
                <stop offset="100%" stop-color="#38bdf8" />
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="34" cy="34" r="28" stroke-width="6" />
            <circle class="ring-fill ring-prog" id="ringProgFill" cx="34" cy="34" r="28" stroke-width="6" stroke="url(#gradProg)" stroke-dasharray="175.93" stroke-dashoffset="0" />
          </svg>
        </div>
        <div class="gauge-info">
          <div class="gauge-title">진도</div>
          <div class="gauge-primary-val" id="progRateText">0% (<span id="progChapterText">단원</span>)</div>
          <div class="gauge-sub-val" id="progSubText">진도 목표 달성 중!</div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=9.0"></script>
</body>
</html>
